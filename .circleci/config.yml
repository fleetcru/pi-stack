version: 2.1

setup: true

# CircleCI still receives the GitHub webhook for every commit, but only this
# small setup job runs unless Companion code or CI configuration changed.
orbs:
  path-filtering: circleci/path-filtering@3.0.0

workflows:
  select-companion-workflow:
    jobs:
      - path-filtering/filter:
          name: check-companion-changes
          base-revision: main
          config-path: .circleci/continue_config.yml
          mapping: |
            pi-companion-exp/.* build-companion true
            .circleci/.* build-companion true
