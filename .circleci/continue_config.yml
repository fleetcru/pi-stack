version: 2.1

parameters:
  build-companion:
    type: boolean
    default: false

# Android companion build on CircleCI's purpose-built cimg/android image.
# Main builds store a signed APK and replace the rolling companion-dev GitHub
# prerelease. Version-tag builds publish immutable versioned GitHub Releases.

orbs:
  android: circleci/android@3.2.0
  github-cli: circleci/github-cli@3.0.0

jobs:
  build:
    docker:
      # cimg/android:2026.08.1 ships android-36 (and 39/37/35/34),
      # Java 21, and Gradle. The image pulls once and Docker layer caching
      # keeps it warm across runs.
      - image: cimg/android:2026.08.1
    resource_class: large
    steps:
      - checkout

      # Warm the Gradle wrapper distribution + dependency/project caches so
      # repeat builds skip re-resolving AGP 9.0.1, Kotlin, Compose, and the rest.
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "pi-companion-exp/gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "pi-companion-exp/gradle/libs.versions.toml" }}
            - gradle-v1-

      - run:
          name: Decode release keystore
          command: |
            set -euo pipefail
            for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [[ -z "${!name:-}" ]]; then
                echo "$name must be set in the CircleCI pi-stack-signing context"
                exit 1
              fi
            done
            # Strip any wrapping/whitespace, then decode with GNU base64.
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > /tmp/release.jks
            if [[ ! -s /tmp/release.jks ]]; then
              echo "Decoded keystore is empty — KEYSTORE_BASE64 is likely missing or malformed"
              exit 1
            fi
            echo "Keystore bytes: $(wc -c < /tmp/release.jks)"
            # Validate the stored password and alias before spending several
            # minutes compiling. This also catches CR/LF accidentally stored
            # as part of a CircleCI context secret.
            if ! keytool -list \
              -keystore /tmp/release.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" >/dev/null; then
              echo "Keystore validation failed; re-store signing context values without trailing line breaks"
              exit 1
            fi
            echo "Keystore password and alias validated"
            echo "export KEYSTORE_PATH=/tmp/release.jks" >> "$BASH_ENV"

      - run:
          name: Accept Android SDK licenses
          command: |
            set -euo pipefail
            # The image already ships android-36 (and Java 21); only the SDK
            # licenses need accepting on a fresh container before Gradle builds.
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager --list_installed | grep -iE 'platforms;android-36' || true

      - run:
          name: Generate version
          command: |
            set -euo pipefail
            # Tag pushes carry the stable/prerelease version. Main builds use
            # the next patch after the latest stable tag, followed by a numeric
            # dev identifier so SemVer ordering works in the in-app updater.
            if [[ -n "${CIRCLE_TAG:-}" ]]; then
              VERSION_NAME="${CIRCLE_TAG#v}"
            else
              git fetch --force --tags origin
              LATEST_STABLE=$(git tag --list 'v*' \
                | sed 's/^v//' \
                | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
                | sort -V \
                | tail -1 \
                || true)
              if [[ -z "$LATEST_STABLE" ]]; then
                echo "No stable Companion vX.Y.Z tag found"
                exit 1
              fi
              IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST_STABLE"
              VERSION_NAME="${MAJOR}.${MINOR}.$((PATCH + 1))-dev.${CIRCLE_BUILD_NUM}"
            fi
            echo "export VERSION_NAME=$VERSION_NAME" >> "$BASH_ENV"
            echo "export VERSION_CODE=$(date +%s)" >> "$BASH_ENV"
            echo "$VERSION_NAME" > /tmp/pi-companion-version

      - android/restore_gradle_cache
      - android/restore_build_cache

      - run:
          name: Build release APK
          command: |
            set -euo pipefail
            # Context vars (KEY_ALIAS, KEYSTORE_PASSWORD, KEY_PASSWORD) are
            # already exported by CircleCI when the job declares the context.
            # KEYSTORE_PATH, VERSION_NAME, and VERSION_CODE were exported into
            # $BASH_ENV by earlier steps, so Gradle sees them without any
            # literal environment block (which does not interpolate $VARS).
            cd pi-companion-exp
            chmod +x gradlew
            ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - android/save_gradle_cache
      - android/save_build_cache

      - save_cache:
          key: gradle-v1-{{ checksum "pi-companion-exp/gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "pi-companion-exp/gradle/libs.versions.toml" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - run:
          name: Verify release APK signature
          command: |
            set -euo pipefail
            APK=$(ls pi-companion-exp/app/build/outputs/apk/release/*.apk | head -1)
            test -n "$APK"
            if command -v apksigner >/dev/null 2>&1; then
              apksigner verify --print-certs "$APK"
            else
              echo "apksigner not found on this image; skipping explicit signature verification"
            fi

      - run:
          name: Stage versioned APK
          command: |
            set -euo pipefail
            VERSION_NAME=$(cat /tmp/pi-companion-version)
            mkdir -p release-artifacts
            cp pi-companion-exp/app/build/outputs/apk/release/*.apk \
              "release-artifacts/pi-companion-${VERSION_NAME}.apk"

      - store_artifacts:
          path: release-artifacts
          destination: pi-companion-apk

      - persist_to_workspace:
          root: .
          paths:
            - release-artifacts

  publish-development:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - github-cli/setup:
          token: GH_TOKEN
      - run:
          name: Publish rolling development APK
          command: |
            set -euo pipefail
            shopt -s nullglob
            APKS=(/tmp/workspace/release-artifacts/pi-companion-*.apk)
            if [[ "${#APKS[@]}" -ne 1 ]]; then
              echo "Expected exactly one staged Companion APK, found ${#APKS[@]}"
              exit 1
            fi
            APK="${APKS[0]}"
            VERSION_NAME=$(basename "$APK" .apk)
            VERSION_NAME="${VERSION_NAME#pi-companion-}"
            test -s "$APK"

            RELEASE_TAG="companion-dev"
            CURRENT_BUILD="${CIRCLE_BUILD_NUM}"
            if ! gh release view "$RELEASE_TAG" --repo fleetcru/pi-stack >/dev/null 2>&1; then
              # Concurrent builds may race to create the one rolling release.
              gh release create "$RELEASE_TAG" \
                --repo fleetcru/pi-stack \
                --target "$CIRCLE_SHA1" \
                --title "Pi Companion development build" \
                --notes "Preparing the latest signed main-branch build." \
                --prerelease \
                || gh release view "$RELEASE_TAG" --repo fleetcru/pi-stack >/dev/null
            fi

            EXISTING_BUILD=$(gh release view "$RELEASE_TAG" \
              --repo fleetcru/pi-stack \
              --json assets \
              --jq '.assets[].name' \
              | sed -nE 's/^pi-companion-.*-dev\.([0-9]+)\.apk$/\1/p' \
              | sort -n \
              | tail -1)
            if [[ -n "$EXISTING_BUILD" && "$EXISTING_BUILD" -ge "$CURRENT_BUILD" ]]; then
              echo "Development build $EXISTING_BUILD is newer than or equal to $CURRENT_BUILD; skipping stale publish"
              exit 0
            fi

            # Upload first so a failed job never removes the last usable APK.
            # Unique dev build filenames let overlapping jobs coexist briefly.
            gh release upload "$RELEASE_TAG" "$APK" --repo fleetcru/pi-stack --clobber
            HIGHEST_BUILD=$(gh release view "$RELEASE_TAG" \
              --repo fleetcru/pi-stack \
              --json assets \
              --jq '.assets[].name' \
              | sed -nE 's/^pi-companion-.*-dev\.([0-9]+)\.apk$/\1/p' \
              | sort -n \
              | tail -1)
            if [[ "$HIGHEST_BUILD" -gt "$CURRENT_BUILD" ]]; then
              gh release delete-asset "$RELEASE_TAG" "$(basename "$APK")" \
                --repo fleetcru/pi-stack --yes \
                || echo "Stale asset was already removed by another publisher"
              echo "A newer development build $HIGHEST_BUILD won the publish race"
              exit 0
            fi

            while IFS= read -r asset; do
              [[ -z "$asset" || "$asset" == "$(basename "$APK")" ]] && continue
              OLD_BUILD=$(printf '%s' "$asset" | sed -nE 's/^pi-companion-.*-dev\.([0-9]+)\.apk$/\1/p')
              if [[ -n "$OLD_BUILD" && "$OLD_BUILD" -lt "$CURRENT_BUILD" ]]; then
                gh release delete-asset "$RELEASE_TAG" "$asset" --repo fleetcru/pi-stack --yes \
                  || echo "Old asset $asset was already removed by another publisher"
              fi
            done < <(gh release view "$RELEASE_TAG" --repo fleetcru/pi-stack --json assets --jq '.assets[].name')
            gh release edit "$RELEASE_TAG" \
              --repo fleetcru/pi-stack \
              --title "Pi Companion development build" \
              --notes "Automated signed build from main at commit ${CIRCLE_SHA1}. CircleCI build ${CIRCLE_BUILD_NUM}. This build may be unstable." \
              --prerelease

  release:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - github-cli/setup:
          token: GH_TOKEN
      - run:
          name: Publish APK to GitHub Release
          command: |
            set -euo pipefail
            if [[ -z "${CIRCLE_TAG:-}" ]]; then
              echo "A version tag is required"
              exit 1
            fi
            VERSION_NAME="${CIRCLE_TAG#v}"
            APK="/tmp/workspace/release-artifacts/pi-companion-${VERSION_NAME}.apk"
            test -s "$APK"

            if gh release view "$CIRCLE_TAG" --repo fleetcru/pi-stack >/dev/null 2>&1; then
              gh release upload "$CIRCLE_TAG" "$APK" \
                --repo fleetcru/pi-stack \
                --clobber
            else
              prerelease_args=()
              if [[ "$CIRCLE_TAG" == *-* ]]; then
                prerelease_args+=(--prerelease)
              fi
              gh release create "$CIRCLE_TAG" "$APK" \
                --repo fleetcru/pi-stack \
                --title "Pi Companion ${CIRCLE_TAG}" \
                --generate-notes \
                --verify-tag \
                "${prerelease_args[@]}"
            fi

workflows:
  build-android:
    when:
      or:
        - << pipeline.parameters.build-companion >>
        - matches:
            pattern: "^v.*"
            value: << pipeline.git.tag >>
    jobs:
      - build:
          context: pi-stack-signing
          filters:
            branches:
              only: main
            tags:
              only: /^v.*/
      - publish-development:
          context: pi-stack-signing
          requires:
            - build
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
      - release:
          context: pi-stack-signing
          requires:
            - build
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
