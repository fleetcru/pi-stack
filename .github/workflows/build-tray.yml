name: Build Pi Server Tray

on:
  push:
    branches:
      - main
    tags:
      - 'tray-v*'
    paths:
      - 'pi-server-tray/**'
      - '.github/workflows/build-tray.yml'
  pull_request:
    paths:
      - 'pi-server-tray/**'
      - '.github/workflows/build-tray.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 0.1.0)'
        required: true
        default: '0.1.0'
      prerelease:
        description: 'Publish as a prerelease'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: pi-server-tray
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: pi-server-tray-linux-amd64
            cgo: '1'
          - runner: windows-latest
            goos: windows
            goarch: amd64
            binary: pi-server-tray-windows-amd64.exe
            cgo: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux tray dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgtk-3-dev libayatana-appindicator3-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: pi-server-tray/go.mod
          cache-dependency-path: pi-server-tray/go.sum

      - name: Test
        run: go test ./... -race -count=1

      - name: Vet
        run: go vet ./...

      - name: Build Linux binary
        if: matrix.goos == 'linux'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -trimpath -ldflags='-s -w' -o "dist/${{ matrix.binary }}" .

      - name: Build Windows binary
        if: matrix.goos == 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -trimpath -ldflags="-H=windowsgui -s -w" -o "dist/${{ matrix.binary }}" .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: pi-server-tray/dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/pi-server-tray-linux-amd64/pi-server-tray-linux-amd64 release/
          cp artifacts/pi-server-tray-windows-amd64.exe/pi-server-tray-windows-amd64.exe release/
          cd release
          sha256sum pi-server-tray-linux-amd64 pi-server-tray-windows-amd64.exe > SHA256SUMS

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pi Server Tray ${GITHUB_REF_NAME#tray-v}" \
            --generate-notes \
            release/pi-server-tray-linux-amd64 \
            release/pi-server-tray-windows-amd64.exe \
            release/SHA256SUMS

      - name: Publish manually dispatched release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "tray-v${VERSION_NAME}"
            --repo "$GITHUB_REPOSITORY"
            --title "Pi Server Tray ${VERSION_NAME}"
            --notes "Manual tray release from ${{ github.sha }}"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" \
            release/pi-server-tray-linux-amd64 \
            release/pi-server-tray-windows-amd64.exe \
            release/SHA256SUMS
