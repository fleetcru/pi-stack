name: Build Android APK (manual)

# CircleCI owns automatic v* tag releases. Keep this workflow as a manual
# fallback so both CI systems cannot race to create the same GitHub Release.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: '0.1.0-dev'

permissions:
  contents: write

concurrency:
  group: manual-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pi-companion-exp/gradle/wrapper/gradle-wrapper.properties', 'pi-companion-exp/**/*.gradle.kts', 'pi-companion-exp/**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x pi-companion-exp/gradlew

      - name: Decode and validate release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name must be configured before publishing a release APK"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > /tmp/release.jks
          test -s /tmp/release.jks
          keytool -list \
            -keystore /tmp/release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_PATH=/tmp/release.jks" >> "$GITHUB_ENV"

      - name: Determine version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version_name must use SemVer, for example 0.1.0 or 0.1.0-beta.1"
            exit 1
          fi
          echo "name=$VERSION_INPUT" >> "$GITHUB_OUTPUT"
          echo "code=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          cd pi-companion-exp
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PATH: /tmp/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}

      - name: Verify release APK signing
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs pi-companion-exp/app/build/outputs/apk/release/*.apk

      - name: Verify MessagePack runtime classes
        run: |
          set -euo pipefail
          unzip -p pi-companion-exp/app/build/outputs/apk/release/*.apk 'classes*.dex' > /tmp/release-dex.bin
          grep -a -q 'MessageBufferU' /tmp/release-dex.bin

      - name: Stage APK with versioned name
        run: |
          mkdir -p staging
          cp pi-companion-exp/app/build/outputs/apk/release/*.apk \
            "staging/pi-companion-${{ steps.version.outputs.name }}.apk"

      # Kept as a build record. Note: GitHub always serves artifacts as a
      # .zip download; for the raw .apk use the Release asset below.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-companion-${{ steps.version.outputs.name }}
          path: staging/*.apk
          retention-days: 90

      # Manual fallback releases are always prereleases. CircleCI owns stable
      # and prerelease publication from explicit v* Git tags.
      - name: Create GitHub prerelease
        run: |
          set -euo pipefail
          gh release create "v${{ steps.version.outputs.name }}-${{ github.run_number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "pi-companion ${{ steps.version.outputs.name }} (build ${{ github.run_number }})" \
            --notes "Manual build from ${{ github.sha }}" \
            --prerelease \
            "staging/pi-companion-${{ steps.version.outputs.name }}.apk"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
