name: Build pi-server

on:
  push:
    paths:
      - 'pi-server-exp/**'
      - '.github/workflows/build-server.yml'
  pull_request:
    paths:
      - 'pi-server-exp/**'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: pi-server-exp

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: pi-server-linux-amd64
          - goos: windows
            goarch: amd64
            binary: pi-server-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: pi-server-exp/go.mod
          cache-dependency-path: pi-server-exp/go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' \
            -o "dist/${{ matrix.binary }}" \
            ./cmd/pi-server

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: pi-server-exp/dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30
