name: CI

# This workflow covers four independent projects. GitHub has no per-job path
# filters, so a single workflow-level `paths` list would run every job when any
# one project changed. Instead the `changes` job computes which project
# directories were touched and each build job gates on its own output.
#
# The workflow-level filter below is only a cheap pre-filter: it stops the
# workflow from starting at all when nothing relevant changed. Correctness comes
# from the per-job `if:` gates, so a false positive here costs one lightweight
# job rather than a full build.

on:
  push:
    branches:
      - main
    paths:
      - 'pi-webby-exp/**'
      - 'pi-companion-exp/**'
      - 'pi-desktop-app/**'
      - 'pi-webby-shared/**'
      - 'install-server*'
      - 'install-exp-external-bridge.*'
      - 'start-exp-*'
      - 'stop-exp-*'
      - 'dev-launcher-common.*'
      - 'windows-installer-common.ps1'
      - 'test-windows-installer.ps1'
      - 'test-shell-scripts.sh'
      - 'pi-server-tray/*.ps1'
      - 'pi-server-exp/scripts/**'
      - '.gitattributes'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'pi-webby-exp/**'
      - 'pi-companion-exp/**'
      - 'pi-desktop-app/**'
      - 'pi-webby-shared/**'
      - 'install-server*'
      - 'install-exp-external-bridge.*'
      - 'start-exp-*'
      - 'stop-exp-*'
      - 'dev-launcher-common.*'
      - 'windows-installer-common.ps1'
      - 'test-windows-installer.ps1'
      - 'test-shell-scripts.sh'
      - 'pi-server-tray/*.ps1'
      - 'pi-server-exp/scripts/**'
      - '.gitattributes'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Computes which project directories changed. Uses plain `git diff` rather
  # than a third-party paths-filter action to avoid adding a new supply-chain
  # dependency to a release-capable repository.
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      webby: ${{ steps.filter.outputs.webby }}
      desktop: ${{ steps.filter.outputs.desktop }}
      android: ${{ steps.filter.outputs.android }}
      installers: ${{ steps.filter.outputs.installers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A two-commit diff needs history; fetch_depth 0 is required for the
          # before/after comparison on push and for the PR merge-base.
          fetch-depth: 0

      - name: Determine changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A manual dispatch intentionally runs everything.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "manual dispatch: enabling all projects"
            for name in webby desktop android installers; do
              echo "$name=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          # Resolve the base commit. PRs diff against the merge base; pushes
          # diff the pushed range. A new branch or force-push reports an
          # all-zero `before`, in which case fall back to the parent commit.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
            head="$HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$HEAD_SHA"
            case "$base" in
              '' | 0000000000000000000000000000000000000000)
                base=$(git rev-parse "${head}^" 2>/dev/null || echo "")
                ;;
            esac
          fi

          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::warning::cannot resolve base commit; enabling all projects"
            for name in webby desktop android installers; do
              echo "$name=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files:"
          echo "$changed"

          # Shared UI sources feed both Webby and Desktop, so a shared change
          # must exercise both frontends.
          webby=false
          desktop=false
          if echo "$changed" | grep -qE '^(pi-webby-exp/|pi-webby-shared/)'; then
            webby=true
          fi
          if echo "$changed" | grep -qE '^(pi-desktop-app/|pi-webby-shared/)'; then
            desktop=true
          fi
          android=false
          if echo "$changed" | grep -q '^pi-companion-exp/'; then
            android=true
          fi
          installers=false
          if echo "$changed" | grep -qE '^(install-server[^/]*$|install-exp-external-bridge\.[^/]+$|start-exp-[^/]+$|stop-exp-[^/]+$|dev-launcher-common\.[^/]+$|windows-installer-common\.ps1$|test-windows-installer\.ps1$|test-shell-scripts\.sh$|pi-server-tray/[^/]+\.ps1$|pi-server-exp/scripts/|\.gitattributes$|\.github/workflows/ci\.yml$)'; then
            installers=true
          fi

          echo "webby=$webby" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "installers=$installers" >> "$GITHUB_OUTPUT"

  webby:
    name: Webby — typecheck, lint, test, build
    needs: changes
    if: needs.changes.outputs.webby == 'true'
    defaults:
      run:
        working-directory: pi-webby-exp
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pi-webby-exp/pnpm-lock.yaml
            pi-webby-shared/pnpm-lock.yaml

      - name: Install shared dependencies
        working-directory: pi-webby-shared
        run: pnpm install --frozen-lockfile

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Enforce Webby bundle budget
        run: |
          set -euo pipefail
          bytes=$(du -sb dist | cut -f1)
          echo "Webby dist bytes: $bytes"
          test "$bytes" -le 10000000

  desktop:
    name: Desktop — typecheck, lint, build, Rust check
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    defaults:
      run:
        working-directory: pi-desktop-app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pi-desktop-app/pnpm-lock.yaml
            pi-webby-shared/pnpm-lock.yaml

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install shared dependencies
        working-directory: pi-webby-shared
        run: pnpm install --frozen-lockfile

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Enforce Desktop frontend bundle budget
        run: |
          set -euo pipefail
          bytes=$(du -sb dist | cut -f1)
          echo "Desktop dist bytes: $bytes"
          test "$bytes" -le 10000000

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Tauri Rust crate
        working-directory: pi-desktop-app/src-tauri
        run: cargo check

      - name: Build packaged Tauri application
        run: pnpm tauri build

  windows-installers:
    name: Windows installer tests
    needs: changes
    if: needs.changes.outputs.installers == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test installers and launchers under Windows PowerShell 5.1
        shell: powershell
        run: .\test-windows-installer.ps1
      - name: Test installers and launchers under PowerShell 7
        shell: pwsh
        run: .\test-windows-installer.ps1

  shell-scripts:
    name: Linux installer and launcher tests
    needs: changes
    if: needs.changes.outputs.installers == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test installation rollback and process cleanup
        run: bash test-shell-scripts.sh

  android:
    name: Android — compile, test & release build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    defaults:
      run:
        working-directory: pi-companion-exp
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build minified release APK
        run: ./gradlew :app:assembleRelease
