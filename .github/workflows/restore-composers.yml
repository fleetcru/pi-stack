name: restore-composers
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-new-session-flow
      - name: Decode and restore composers
        run: |
          set -euo pipefail
          cat pi-webby-exp/.ci-restore/composer.b64.part0{0,1,2,3,4,5,6,7} | tr -d '\n' | base64 -d > /tmp/composer.tsx
          echo "sha1=$(sha1sum /tmp/composer.tsx)"
          test "$(sha1sum /tmp/composer.tsx | awk '{print $1}')" = "7f62f15b5420cf73a2f3ae2342119a3a233229d5"
          cp /tmp/composer.tsx pi-webby-exp/src/components/quick-session-composer.tsx
          cp /tmp/composer.tsx pi-desktop-app/src/components/quick-session-composer.tsx
          rm -rf pi-webby-exp/.ci-restore
          rm -f pi-webby-exp/.ci-agent-push-test.txt pi-webby-exp/.ci-agent-push-test2.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix(ci): restore quick-session-composer from verified b64 parts (webby + desktop)"
          git push
