name: apply-lock-patch
on:
  push:
    branches: [feat/unified-new-session-flow]
    paths:
      - 'pi-webby-exp/.ci-lock/**'
      - '.github/workflows/apply-lock-patch.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-new-session-flow
      - name: Apply pnpm-lock patch from base64
        run: |
          set -euo pipefail
          test -f pi-webby-exp/.ci-lock/pnpm-lock.patch.b64
          base64 -d pi-webby-exp/.ci-lock/pnpm-lock.patch.b64 > /tmp/pnpm-lock.patch
          patch -p1 < /tmp/pnpm-lock.patch
          rm -rf pi-webby-exp/.ci-lock
          rm -f .github/workflows/apply-lock-patch.yml .github/workflows/restore-composers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix(ci): refresh pnpm-lock for @testing-library/dom (webby)"
          git push
